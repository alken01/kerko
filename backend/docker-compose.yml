services:
  backend:
    container_name: kerko-backend
    image: kerko-backend
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${KERKO_BACKEND_PORT:-8081}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - KERKO_ADMIN_TOKEN=${KERKO_ADMIN_TOKEN}
    volumes:
      - ./data:/app/data
    networks:
      - kerko-network

networks:
  kerko-network:
    driver: bridge
